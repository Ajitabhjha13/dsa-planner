<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Java code colouring (internet chahiye; na ho toh plain text dikhega) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <a href="#/dashboard" class="brand">
        <span class="brand-mark">{ }</span>
        <span class="brand-name">DSA Planner</span>
      </a>

      <nav class="nav">
        <a href="#/dashboard" class="nav-link" data-page="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
          <span>Dashboard</span>
        </a>
        <!-- Plan: click karne pe neeche do sub-links khulte hain -->
        <div class="nav-group" id="nav-plan">
          <a href="#/plan/warmup" class="nav-link nav-parent" data-parent="plan">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span>Plan</span>
            <svg class="nav-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </a>
          <div class="nav-sub">
            <a href="#/plan/warmup" class="nav-link nav-child" data-page="plan/warmup">
              <svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></svg>
              <span>Warm-up</span>
            </a>
            <a href="#/plan/main" class="nav-link nav-child" data-page="plan/main">
              <svg viewBox="0 0 24 24"><path d="M4 21V4M4 4h12l-2 4 2 4H4"/></svg>
              <span>Main Quest</span>
            </a>
          </div>
        </div>
        <a href="#/plan2" class="nav-link" data-page="plan2">
          <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
          <span>Plan 2.0</span>
        </a>
        <a href="#/videos" class="nav-link" data-page="videos">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
          <span>Videos</span>
        </a>
        <a href="#/problems" class="nav-link" data-page="problems">
          <svg viewBox="0 0 24 24"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>
          <span>Problems</span>
        </a>
        <a href="#/profile" class="nav-link" data-page="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
          <span>Profile</span>
        </a>
        <a href="#/settings" class="nav-link" data-page="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="avatar">AK</div>
        <div>
          <div class="user-name">Ajitabh</div>
          <div class="user-sub">Placement by Dec 2026</div>
        </div>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT (yahan pages render hote hain) ===== -->
    <main id="app" class="main"></main>
  </div>

  <!-- Order important hai: pehle data + pages, last mein router -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/warmup.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/tracker.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/plan.js"></script>
  <script src="js/pages/quest.js"></script>
  <script src="js/pages/planpage.js"></script>
  <script src="js/pages/videos.js"></script>
  <script src="js/pages/problems.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
